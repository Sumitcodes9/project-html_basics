<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <nav>
        <a href="index.html" target="_blank">Home</a>
        <a href="events.html" target="_blank">Events</a>
        <a href="register.html" target="_blank">Register</a>
    </nav>
    <h1>Registration Form OF TECH FEST</h1>

    <form action="#">
        <div>
            <label for="username">Username</label>
            <input type="text" id="Username" placeholder="Enter Username"><br><br>
            <label for="email">Email Id</label>
            <input type="email" id="email"><br><br>
            <label for="phone">Phone No</label>
            <input type="tel" id="phone"><br><br>
            <label for="date">D.O.B</label>
            <input type="date" id="date"><br><br>
             <label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" id="male">
            <label for="female">Female</label>
            <input type="radio" id="Female"><br><br>
            <label for="Experience">Experience:</label>
            <select name="Experience" id="Experience">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select><br><br>

            <label for="file">Choose File</label>
            <input type="file" id="file"><br><br>
            <label for="address">Address</label>
            <textarea id="address"></textarea><br><br>
           
        
            <input type="checkbox" id="tands">
            <label for="tanss">Terms and Conditions</label><br><br>
            <button type="submit">Submit</button>
            <button type="reset">reset</button>

        </div> 
    </form>   
    <hr>
</body>
</html>
